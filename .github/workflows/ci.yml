name: Inventory CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: inventory-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      REACT_APP_BACKEND_URL: https://backend.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select reviewed native feature profile
        run: python3 tools/ci_frontend_profile.py >> "$GITHUB_ENV"
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
      - name: Run frontend tests
        working-directory: frontend
        run: yarn test --watchAll=false --runInBand
      - name: Build production frontend (warnings fail CI)
        working-directory: frontend
        run: yarn build

  backend:
    name: Backend integrity and disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: purchase_implementation_test
          POSTGRES_DB: native_purchase_test_control
          POSTGRES_PASSWORD: synthetic-ci-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purchase_implementation_test -d native_purchase_test_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHON_DOTENV_DISABLED: '1'
      NATIVE_PURCHASE_TEST_DSN: postgresql://purchase_implementation_test:synthetic-ci-password-only@127.0.0.1:5432/native_purchase_test_control
      NATIVE_BACKUP_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      NATIVE_BACKUP_EVIDENCE: ${{ runner.temp }}/synthetic-backup-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install matching PostgreSQL backup client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/inventory-ci-pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Run offline backend review checks
        run: python tools/run_review_tests.py offline --report "$RUNNER_TEMP/review-offline.xml"
      - name: Run disposable database accounting and restore checks
        run: python tools/run_review_tests.py database --report "$RUNNER_TEMP/review-database.xml"

  required:
    name: Inventory CI
    if: ${{ always() }}
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
    steps:
      - name: Require both complete test jobs
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
