name: Lane guard tests

on:
  pull_request:
    paths: ['tools/lanes/**', '.github/lanes.json']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run the lane guard tests
        working-directory: tools/lanes
        run: python3 -m unittest -v test_lane_guard
