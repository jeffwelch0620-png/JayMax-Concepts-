name: Lane guard

# Keeps Jay's and Rudd's code-lane pull requests (side-jay-*, side-rudd-*) inside their lane
# (jmax-workspace docs/handoffs/jay-rudd/RULES.md §3b): branch named side-<name>-<issue>-<short-name>,
# only lane files changed (.github/lanes.json). Main-build branches pass. Each result depends
# only on the pull request itself, so it never goes stale; "one open pull request per person" is a
# warning from the overlap check instead. Claims live on the private JMAX Build board, which this public repo's token
# can't read, so the issue number is checked for format here and against the board in review.
# pull_request_target runs this file as it is on main, so a pull request can't edit the check
# away; it only reads the pull request through the API and never checks out or runs its code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  lanes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Gather the pull request's files and the other open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Every changed path, plus the old path of a renamed file, so moving a protected file
          # into the lane still counts as changing it.
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
      - name: Check the lane rules
        env:
          HEAD: ${{ github.head_ref }}
        # The rules come from main (checked out above), so a branch can't loosen its own lane.
        run: |
          if [ ! -f tools/lanes/lane_guard.py ]; then echo "Lane guard isn't on main yet; skipping."; exit 0; fi
          python3 tools/lanes/lane_guard.py check --config .github/lanes.json --branch "$HEAD" \
            --files "$RUNNER_TEMP/files.txt" | tee "$RUNNER_TEMP/result.md"
          exit "${PIPESTATUS[0]}"
